[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-orchestra"
version = "0.2.0a1"
description = "Policy-controlled, budget-aware multi-model coding delegation over MCP"
readme = "model_orchestra/PUBLIC_README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "anthropic>=0.40.0",
]

[project.optional-dependencies]
acp = ["agent-client-protocol>=0.11.0"]
test = ["pytest>=8.0"]
build = ["build>=1.2.0"]

[project.scripts]
model-orchestra = "model_orchestra.cli:main"

[tool.setuptools]
packages = ["model_orchestra", "model_orchestra.data"]
py-modules = ["server"]
include-package-data = true

[tool.setuptools.package-data]
"model_orchestra.data" = ["*.json"]
